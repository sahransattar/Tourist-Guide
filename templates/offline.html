<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Mode - Tourist Guide PWA</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; text-align:center; padding: 2rem;">
  <div style="max-width: 500px; background: var(--bg-glass-card); border: 1px solid var(--border-glass); padding: 3rem 2rem; border-radius: var(--radius-lg);">
    <i class="fas fa-wifi" style="font-size: 3.5rem; color: var(--warning); margin-bottom: 1.5rem;"></i>
    <h1 style="font-size: 2rem; margin-bottom: 1rem;">You are Currently Offline</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">
      It looks like your internet connection is unavailable. Don't worry! You can still view your previously visited tourist places and saved favorites offline.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
      <a href="/favorites" class="btn btn-primary"><i class="fas fa-heart"></i> View Saved Favorites</a>
      <button onclick="window.location.reload()" class="btn btn-outline"><i class="fas fa-rotate-right"></i> Try Reconnecting</button>
    </div>
  </div>
</body>
</html>
