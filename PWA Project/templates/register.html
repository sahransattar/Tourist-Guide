{% extends 'base.html' %}

{% block title %}Create Account - Explore India PWA{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="font-size: 2.2rem; color: var(--accent); margin-bottom: 0.5rem;">
          <i class="fas fa-user-plus"></i>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Join Explore India to save and manage favorite tourist spots</p>
      </div>

      <form action="{{ url_for('register') }}" method="POST">
        <div class="form-group">
          <label class="form-label" for="name"><i class="fas fa-user"></i> Full Name</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="e.g. John Doe" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email"><i class="fas fa-envelope"></i> Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="e.g. john@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password"><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Create a strong password" required minlength="4">
        </div>

        <button type="submit" class="btn btn-accent" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">
          Create Account <i class="fas fa-user-check"></i>
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-glass); font-size: 0.9rem; color: var(--text-muted);">
        Already registered? <a href="{{ url_for('login') }}" style="color: var(--accent); font-weight: 600;">Sign In Here</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
