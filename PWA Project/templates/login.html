{% extends 'base.html' %}

{% block title %}User Login - Explore India PWA{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="font-size: 2.2rem; color: var(--primary); margin-bottom: 0.5rem;">
          <i class="fas fa-circle-user"></i>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to access your saved favorite places</p>
      </div>

      <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
          <label class="form-label" for="email"><i class="fas fa-envelope"></i> Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="e.g. john@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password"><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">
          Sign In <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-glass); font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 600;">Register Here</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
